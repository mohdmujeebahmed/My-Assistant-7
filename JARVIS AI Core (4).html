<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S // AI CORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --panel:rgba(255,255,255,.035); --line:rgba(255,255,255,.1);
  --cyan:#ff8c42; --teal:#4fd1ff; --amber:#ff5a5a; --dim:#9a9488; --white:#f6f0e6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:
  radial-gradient(circle at 50% 18%,#181310 0%,#0a0a0c 55%,#050506 100%);
  color:var(--white);
  font-family:'Sora',system-ui,-apple-system,sans-serif;overflow:hidden;}
body{position:relative;display:flex;flex-direction:column;}

canvas#fx{position:fixed;inset:0;z-index:1;pointer-events:none;}
.vignette{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,140,66,.07),rgba(0,0,0,.92) 75%);z-index:1;pointer-events:none;}
.scan{position:fixed;inset:0;pointer-events:none;z-index:6;
  background:linear-gradient(transparent,rgba(255,140,66,.035) 50%,transparent);
  background-size:100% 4px;mix-blend-mode:screen;opacity:.4;}
.brackets span{position:fixed;width:46px;height:46px;border:1.5px solid rgba(255,140,66,.35);z-index:4;pointer-events:none;}
.brackets .tl{top:14px;left:14px;border-right:none;border-bottom:none;}
.brackets .tr{top:14px;right:14px;border-left:none;border-bottom:none;}
.brackets .bl{bottom:14px;left:14px;border-right:none;border-top:none;}
.brackets .br{bottom:14px;right:14px;border-left:none;border-top:none;}

.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;
  padding:16px 30px;font-size:11px;letter-spacing:3px;color:var(--dim);
  font-family:'Space Mono',monospace;border-bottom:1px solid var(--line);
  background:linear-gradient(rgba(255,140,66,.03),transparent);}
.topbar b{color:var(--cyan);font-weight:700;}

.main{flex:1;position:relative;z-index:3;display:grid;min-height:0;overflow:hidden;
  grid-template-columns:220px 1fr 220px;align-items:center;padding:10px 20px;gap:10px;}

.panel{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:16px;max-height:90%;overflow:hidden;
  padding:18px;backdrop-filter:blur(14px);
  box-shadow:0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);}
.panel h3{margin:0 0 14px;font-size:10.5px;letter-spacing:4px;color:var(--cyan);
  font-family:'Space Mono',monospace;font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:10px;}
.sys-row{display:flex;justify-content:space-between;font-size:11.5px;margin:10px 0;color:var(--dim);
  font-family:'Space Mono',monospace;}
.sys-row span.dot{color:var(--cyan);margin-right:6px;text-shadow:0 0 6px var(--cyan);}
.sys-row b{color:var(--white);font-weight:500;font-size:10px;letter-spacing:1px;}
#activity{display:flex;flex-direction:column-reverse;gap:10px;max-height:220px;overflow:hidden;}
.act-item{font-size:10.5px;color:var(--dim);opacity:0;animation:fadeIn .5s forwards;
  font-family:'Space Mono',monospace;
  border-left:2px solid var(--cyan);padding-left:9px;}
@keyframes fadeIn{to{opacity:1}}

.core-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,1.6vh,18px);max-height:100%;overflow:hidden;padding:6px 0;}
.core{position:relative;width:clamp(200px,26vw,320px);height:clamp(200px,26vw,320px);flex-shrink:0;}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line);}
.r1{animation:spin 16s linear infinite;}
.r2{inset:26px;animation:spin 11s linear infinite reverse;border-color:rgba(255,140,66,.3);}
.r3{inset:52px;animation:spin 7s linear infinite;border-style:dashed;border-color:rgba(79,209,255,.3);}
.r4{inset:0;border:none;}
.r4::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,140,66,.55),transparent 22%);
  animation:spin 3.2s linear infinite;mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));}
.hexring{position:absolute;inset:70px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,140,66,.12) 0deg 2deg, transparent 2deg 12deg);
  animation:spin 22s linear infinite reverse;opacity:.5;}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{position:absolute;inset:-14px;animation:spin 9s linear infinite;}
.orbit i{position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;
  background:var(--cyan);border-radius:50%;box-shadow:0 0 8px var(--cyan);}
.core-center{position:absolute;inset:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,140,66,.6),rgba(255,90,60,.18) 55%,transparent 75%);
  box-shadow:0 0 70px 14px rgba(255,140,66,.35), 0 0 140px 30px rgba(255,90,60,.12);
  animation:pulse 3s ease-in-out infinite;
  transform:scale(var(--amp,1));transition:transform .05s ease-out;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.core.listening .core-center{animation:none;}
.core.listening .ring{filter:drop-shadow(0 0 calc(4px + var(--amp,0) * 12px) var(--cyan));}
.core.thinking .r1{animation-duration:3s;}
.core.thinking .r2{animation-duration:1.6s;}
.core.thinking .r3{animation-duration:1s;}
.core.thinking .ring{filter:drop-shadow(0 0 6px var(--cyan));}
.core.executing .core-center{background:radial-gradient(circle,rgba(255,90,90,.55),rgba(79,209,255,.2) 60%,transparent 75%);}
.core.executing .r4::before{background:conic-gradient(from 0deg,rgba(255,90,90,.6),transparent 22%);}
.core.complete .core-center{background:radial-gradient(circle,rgba(79,209,255,.8),transparent 70%);}
.core.speaking .core-center{animation:speakPulse .4s ease-in-out infinite;}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

.status-text{text-align:center;}
.status-line1{font-size:clamp(18px,2.4vw,26px);letter-spacing:7px;font-weight:600;color:var(--white);
  text-shadow:0 0 20px rgba(255,140,66,.4);font-family:'Sora',sans-serif;}
.status-line2{font-size:11px;letter-spacing:4px;color:var(--cyan);margin-top:6px;
  font-family:'Space Mono',monospace;}
.reply{max-width:460px;min-height:20px;font-size:14.5px;color:var(--white);
  letter-spacing:.3px;text-align:center;margin-top:6px;opacity:0;transition:opacity .3s;
  font-weight:300;}
.reply.show{opacity:1;}

.wave{display:flex;gap:3px;align-items:flex-end;height:26px;justify-content:center;margin-top:4px;}
.wave span{width:3px;background:var(--cyan);border-radius:2px;height:4px;
  transition:height .06s ease-out,background-color .15s;}

.exec-log{width:100%;max-width:520px;max-height:clamp(70px,16vh,150px);min-height:0;
  font-size:11px;color:var(--teal);overflow-y:auto;
  letter-spacing:.5px;text-align:left;line-height:1.8;font-family:'Space Mono',monospace;}
.exec-log::-webkit-scrollbar{width:4px;}
.exec-log::-webkit-scrollbar-thumb{background:rgba(255,140,66,.3);border-radius:4px;}
.exec-log .line{opacity:0;animation:fadeIn .4s forwards;}
.exec-log .ok{color:var(--cyan);}

.cmdwrap{position:relative;z-index:3;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;}
.cmdbox{display:flex;align-items:center;gap:12px;width:min(640px,92%);
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:32px;
  padding:12px 12px 12px 22px;backdrop-filter:blur(16px);
  box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);}
.cmdbox input{flex:1;background:none;border:none;outline:none;color:var(--white);
  font-size:14px;letter-spacing:.3px;font-family:'Sora',sans-serif;}
.cmdbox input::placeholder{color:var(--dim);}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,140,66,.08);color:var(--cyan);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.2s;}
.mic:hover{background:rgba(255,140,66,.18);transform:scale(1.05);}
.mic.on{background:var(--cyan);color:#0a0a0c;box-shadow:0 0 20px rgba(255,140,66,.7);}

@media (max-width:820px){
  .main{grid-template-columns:1fr;}
  .panel{display:none;}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="vignette"></div><div class="scan"></div>
<div class="brackets"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

<div class="topbar">
  <span>STARK INDUSTRIES AI &nbsp; <b id="clock"></b></span>
  <span>SYSTEM <b>ONLINE</b> &nbsp; LOCAL MODE</span>
</div>

<div class="main">
  <div class="panel">
    <h3>SYSTEMS</h3>
    <div class="sys-row"><span><span class="dot">●</span>AI CORE</span><b>ONLINE</b></div>
    <div class="sys-row"><span><span class="dot">●</span>VOICE</span><b id="voiceState">READY</b></div>
    <div class="sys-row"><span><span class="dot">●</span>BROWSER</span><b>READY</b></div>
    <div class="sys-row"><span><span class="dot">●</span>AUTOMATION</span><b>READY</b></div>
    <div class="sys-row"><span><span class="dot">●</span>MEMORY</span><b>LOCAL</b></div>
  </div>

  <div class="core-wrap">
    <div class="core" id="core">
      <div class="hexring"></div>
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="ring r4"></div>
      <div class="orbit"><i></i></div>
      <div class="core-center"></div>
    </div>
    <div class="status-text">
      <div class="status-line1" id="line1">JARVIS</div>
      <div class="status-line2" id="line2">ONLINE</div>
      <div class="reply" id="reply"></div>
      <div class="wave" id="wave" style="display:none"></div>
    </div>
    <div class="exec-log" id="execLog"></div>
  </div>

  <div class="panel">
    <h3>ACTIVITY</h3>
    <div id="activity"></div>
  </div>
</div>

<div class="cmdwrap">
  <div class="cmdbox">
    <span style="color:var(--teal)">▸</span>
    <input id="cmdInput" placeholder="Speak or type a command..." autocomplete="off">
    <button class="mic" id="micBtn" title="Voice input">🎙</button>
  </div>
</div>

<script>
/* ---------- particle field ---------- */
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let W, H, particles = [];
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
for(let i=0;i<70;i++){
  particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.6+.4, vx:(Math.random()-.5)*.15, vy:(Math.random()-.5)*.15,
    a:Math.random()*.5+.1});
}
function drawFX(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = 'rgba(255,140,66,1)';
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    ctx.globalAlpha = p.a;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawFX);
}
drawFX();

/* ---------- routes (open sites) ---------- */
const ROUTES = [
  { test: t => /resume/.test(t), name: "banaoresumee.online", url: "https://banaoresumee.online" },
  { test: t => /(favou?rite song|my song|play.*song)/.test(t), name: "your favorite song", url: "https://youtu.be/fLexgOxsZu0?si=e3mgET9RPBONjHSF" },
  { test: t => /you ?tube/.test(t), name: "YouTube", url: "https://youtube.com" },
  { test: t => /git ?hub/.test(t), name: "GitHub", url: "https://github.com" },
];

/* ---------- conversational replies ---------- */
const TALK = [
  { test: t => /^(hi|hello|hey|yo)\b/.test(t), reply: () => pick(["Hello, sir.","Hey there.","Good to hear from you."]) },
  { test: t => /how are you/.test(t), reply: () => "All systems nominal. Running at full capacity." },
  { test: t => /(who.*(own|creator|made|built)|your owner|whose ai)/.test(t), reply: () => "My owner is Iron Man, sir." },
  { test: t => /who are you/.test(t), reply: () => "I'm JARVIS, your personal AI." },
  { test: t => /(thank|thanks)/.test(t), reply: () => "Anytime, sir." },
  { test: t => /(bye|shut down|goodnight|good night)/.test(t), reply: () => "Standing by. Call whenever you need me." },
  { test: t => /what.*time/.test(t), reply: () => "It's " + new Date().toLocaleTimeString('en-GB') + "." },
  { test: t => /what.*your name/.test(t), reply: () => "I go by JARVIS." },
];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const CAPABILITIES = [
  "Open websites by voice or text — resume builder, YouTube, GitHub, and more",
  "Hold natural conversation — greetings, small talk, quick questions",
  "React visually to your live voice in real time, not a canned animation",
  "Track recent activity and live system status in the side panels",
  "Reply out loud using speech synthesis",
  "Understand typed commands when voice isn't available",
];

const core = document.getElementById('core');
const line1 = document.getElementById('line1');
const line2 = document.getElementById('line2');
const wave = document.getElementById('wave');
const replyEl = document.getElementById('reply');
const execLog = document.getElementById('execLog');
const activity = document.getElementById('activity');
const input = document.getElementById('cmdInput');
const micBtn = document.getElementById('micBtn');
const voiceState = document.getElementById('voiceState');

function clock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }
clock(); setInterval(clock, 1000);

function setState(state){
  core.className = 'core ' + state;
  wave.style.display = state === 'listening' ? 'flex' : 'none';
  if(state === 'idle'){ line1.textContent='JARVIS'; line2.textContent='ONLINE'; }
  if(state === 'listening'){ line1.textContent='LISTENING'; line2.textContent='...'; }
  if(state === 'thinking'){ line1.textContent='PROCESSING'; line2.textContent='...'; }
  if(state === 'executing'){ line1.textContent='EXECUTING'; line2.textContent='COMMAND'; }
  if(state === 'complete'){ line1.textContent='TASK'; line2.textContent='COMPLETE'; }
  if(state === 'speaking'){ line1.textContent='JARVIS'; line2.textContent='RESPONDING'; }
}

function showReply(text){
  replyEl.textContent = text;
  replyEl.classList.add('show');
  clearTimeout(showReply._t);
  showReply._t = setTimeout(()=>replyEl.classList.remove('show'), 4500);
}

function logLine(text, ok){
  const div = document.createElement('div');
  div.className = 'line' + (ok ? ' ok' : '');
  div.textContent = text;
  execLog.appendChild(div);
  if(execLog.children.length > 8) execLog.removeChild(execLog.firstChild);
  execLog.scrollTop = execLog.scrollHeight;
}

function addActivity(text){
  const d = new Date();
  const item = document.createElement('div');
  item.className = 'act-item';
  item.textContent = `${d.toLocaleTimeString('en-GB').slice(0,5)}  ${text}`;
  activity.prepend(item);
  while(activity.children.length > 6) activity.removeChild(activity.lastChild);
}

let voicesReady = (typeof speechSynthesis !== 'undefined' && speechSynthesis.getVoices().length > 0);
if(typeof speechSynthesis !== 'undefined' && !voicesReady){
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
}
let speechUnlocked = false;
function unlockSpeech(){
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener('click', unlockSpeech, { once: true });
document.addEventListener('keydown', unlockSpeech, { once: true });
function speak(text){
  return new Promise(resolve=>{
    try{
      if(!('speechSynthesis' in window)){ resolve(); return; }
      speechSynthesis.cancel(); // clear any stuck/queued utterances first
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.02; u.pitch = 0.85; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      if(voices.length){
        const enVoice = voices.find(v => /en/i.test(v.lang));
        if(enVoice) u.voice = enVoice;
      }
      let done = false;
      const finish = () => { if(!done){ done = true; resolve(); } };
      u.onend = finish;
      u.onerror = finish;
      // Chrome sometimes needs a tick after cancel() before speak() is honored
      setTimeout(() => {
        try{ speechSynthesis.speak(u); }catch(e){ finish(); }
      }, 30);
      // Safety timeout in case the browser never fires onend
      setTimeout(finish, Math.max(2500, text.length * 90));
    }catch(e){ resolve(); }
  });
}

async function runCommand(raw, alreadyOpened){
  const t = raw.trim();
  if(!t) return;
  const low = t.toLowerCase();
  execLog.innerHTML = '';
  stopAudioReaction();

  const talk = TALK.find(x => x.test(low));
  const route = ROUTES.find(r => r.test(low));
  const asksCapabilities = /(what can you do|your (abilities|capabilities|features)|what do you do|show me what you can do|help$)/.test(low);

  if(asksCapabilities){
    setState('thinking');
    await wait(400);
    setState('executing');
    logLine('CAPABILITY SCAN');
    await wait(300);
    for(const c of CAPABILITIES){
      logLine('✓ ' + c, true);
      await wait(260);
    }
    const summary = "Here's everything I can do, sir.";
    setState('speaking');
    showReply(summary);
    addActivity('Listed capabilities');
    await speak(summary);
    await wait(1200);
    setState('idle');
    return;
  }

  if(talk){
    setState('thinking');
    await wait(350);
    const text = talk.reply();
    setState('speaking');
    showReply(text);
    addActivity('Said: "' + text + '"');
    await speak(text);
    setState('idle');
    return;
  }

  setState('thinking');
  logLine('COMMAND RECEIVED');
  await wait(500);

  if(route){
    setState('executing');
    logLine('OPEN_URL');
    logLine('TARGET: ' + route.name.toUpperCase());
    await wait(400);
    logLine('EXECUTING...');
    await wait(500);
    let opened = alreadyOpened;
    if(!opened) window.open(route.url, '_blank');
    logLine('✓ CONNECTION ESTABLISHED', true);
    await wait(200);
    logLine('✓ BROWSER LAUNCHED', true);
    await wait(200);
    logLine('✓ ' + route.name.toUpperCase() + ' OPENED', true);
    addActivity(route.name + ' opened');
    setState('speaking');
    showReply('Opening ' + route.name + '.');
    await speak('Opening ' + route.name + '.');
  } else {
    setState('executing');
    logLine('NO MATCHING ROUTE');
    await wait(500);
    logLine('COMMAND NOT RECOGNIZED');
    addActivity('Unrecognized: "' + t + '"');
    setState('speaking');
    showReply("I didn't quite catch that, sir.");
    await speak("I didn't quite catch that, sir.");
  }

  await wait(400);
  setState('complete');
  await wait(800);
  setState('idle');
  execLog.innerHTML = '';
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && input.value.trim()){
    const v = input.value;
    input.value = '';
    const route = ROUTES.find(r => r.test(v.toLowerCase()));
    if(route) window.open(route.url, '_blank'); // opened right here, still inside the real keypress
    runCommand(v, !!route);
  }
});

/* ---------- waveform bars ---------- */
const BAR_COUNT = 28;
for(let i=0;i<BAR_COUNT;i++) wave.appendChild(document.createElement('span'));
const bars = wave.querySelectorAll('span');

/* ---------- real mic amplitude reaction ---------- */
let audioCtx, analyser, micSource, micStream, rafId;
async function startAudioReaction(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    micSource = audioCtx.createMediaStreamSource(micStream);
    micSource.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function tick(){
      if(!analyser) return;
      analyser.getByteFrequencyData(data);
      let sum = 0;
      bars.forEach((bar, i) => {
        const v = data[i % data.length] / 255;
        sum += v;
        bar.style.height = (4 + v * 34) + 'px';
        bar.style.background = v > 0.55 ? 'var(--white)' : 'var(--cyan)';
      });
      core.style.setProperty('--amp', (1 + (sum/bars.length) * 0.7).toFixed(3));
      rafId = requestAnimationFrame(tick);
    }
    tick();
  }catch(e){
    // Mic amplitude visualization is optional flair — recognition can still work without it
  }
}
function stopAudioReaction(){
  if(rafId) cancelAnimationFrame(rafId);
  if(micStream) micStream.getTracks().forEach(t => t.stop());
  if(audioCtx) audioCtx.close().catch(()=>{});
  analyser = null; audioCtx = null; micStream = null;
  bars.forEach(bar => bar.style.height = '4px');
  core.style.setProperty('--amp', 1);
}

/* ---------- speech recognition ---------- */
let recognizing = false, recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.onstart = () => {
    recognizing = true; micBtn.classList.add('on');
    voiceState.textContent = 'LISTENING';
    setState('listening');
    startAudioReaction();
  };
  recognition.onend = () => {
    recognizing = false; micBtn.classList.remove('on');
    if(voiceState.textContent === 'LISTENING') voiceState.textContent = 'READY';
    stopAudioReaction();
    if(core.className.includes('listening')) setState('idle');
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    input.value = text;
    const route = ROUTES.find(r => r.test(text.toLowerCase()));
    if(route) window.open(route.url, '_blank'); // opened the instant speech is recognized
    runCommand(text, !!route);
  };
  recognition.onerror = (e) => {
    recognizing = false; micBtn.classList.remove('on');
    stopAudioReaction();
    setState('idle');
    let msg = 'Voice input failed.';
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      msg = 'Microphone access was blocked. Allow it in your browser\u2019s site settings, or just type your command below.';
      voiceState.textContent = 'BLOCKED';
    } else if(e.error === 'no-speech'){
      msg = "I didn't hear anything, sir.";
      voiceState.textContent = 'READY';
    } else {
      voiceState.textContent = 'ERROR';
    }
    showReply(msg);
    addActivity('Voice error: ' + e.error);
  };
} else {
  voiceState.textContent = 'UNAVAILABLE';
}
micBtn.addEventListener('click', () => {
  if(!recognition){
    showReply('Voice recognition isn\u2019t supported in this browser \u2014 try Chrome or Edge, or type your command.');
    return;
  }
  if(recognizing){ recognition.stop(); return; }
  try{
    recognition.start();
  }catch(e){
    showReply('Could not start the microphone. Try again in a moment.');
  }
});
</script>
</body>
</html>
